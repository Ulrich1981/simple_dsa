<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple DSA / Ars Magica</title>
    <style>
        :root {
        --bg: #eeeeee;
            --card: #182032;
            --text: #e6edf7;
            --muted: #a8b3c7;
            --accent: #4da3ff;
            --border: #2a3550;
        }
        html, body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans", sans-serif;
            font-size: 12x;
            line-height: 1.4;
        }
        header {
            padding: 2px 2px;
            background: var(--card);
            margin: 0 auto;
            flex-shrink: 0; 
        }

        body {
            height: 100vh; /* Full viewport height */
            display: flex;
            flex-direction: column;
        }

        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .nav-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .nav-buttons, .nav-btn  {
            padding: 2px 2px;
            border: 1px solid #bbb;
            border-radius: 8px;
            cursor: pointer;
        }

        .nav-btn:hover {
            background-color: #45a049;
        }

        .nav-btn.active {
            background-color: #2196F3;
        }


        .loading {
            text-align: center;
            color: #666;
            font-style: italic;
        }

        .welcome {
            text-align: center;
            color: #666;
            padding: 50px 20px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 5px;
            flex: 1;
        }

        .system-select {
            background: #ffffff;
            color: #111;
            padding: 2px 6px;
            border: 1px solid #bbb;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Simple DSA / Ars Magica</h1>
        <div class="nav-controls">
            <button class="nav-btn" onclick="showHome()">Home</button>
            <label for="systemSelect">System:</label>
            <select id="systemSelect" class="system-select">
                <option value="dsa">Simple DSA</option>
                <option value="ars">Ars Magica</option>
            </select>
            <div class="nav-buttons">
                <button class="nav-btn" onclick="loadMode('rulebook')">Regelwerk</button>
                <button class="nav-btn" onclick="loadMode('generator')">Charaktergenerator</button>
            </div>
        </div>
    </div>

    <div class="content-area" id="contentArea">
        <div class="welcome">
            <h2>Willkommen beim Charaktertool</h2>
            <p>Wähle ein Tool aus der obigen Navigation, um zu beginnen.</p>
        </div>
    </div>

    <script>
        // Remove active class from all buttons
        function clearActiveButtons() {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('active');
            });
        }

        // Set active button
        function setActiveButton(buttonText) {
            clearActiveButtons();
            document.querySelectorAll('.nav-btn').forEach(btn => {
                if (btn.textContent === buttonText) {
                    btn.classList.add('active');
                }
            });
        }

        // Show loading state
        function showLoading() {
            document.getElementById('contentArea').innerHTML = 
                '<div class="loading">Loading...</div>';
        }

        // Load rulebook
        function loadRulebook(system) {
            showLoading();

            document.getElementById('contentArea').innerHTML = 
                `<iframe src="${system === 'ars' ? 'ars_magica.md' : 'simple_dsa.md'}"></iframe>`;
        }

        // Load character generator
        function loadCharacterGenerator(system) {
            showLoading();
            
            // Load your character generator page
            document.getElementById('contentArea').innerHTML = 
                `<iframe src="character_generator/index.html?system=${system}"></iframe>`;
        }

        function selectedSystem() {
            const select = document.getElementById('systemSelect');
            return (select && select.value) || 'dsa';
        }

        function loadMode(mode) {
            const system = selectedSystem();
            setActiveButton(mode === 'rulebook' ? 'Regelwerk' : 'Charaktergenerator');
            if (mode === 'rulebook') {
                loadRulebook(system);
            } else {
                loadCharacterGenerator(system);
            }
        }

        // Show home page
        function showHome() {
            setActiveButton('Home');
            document.getElementById('contentArea').innerHTML = `
                <div class="welcome">
                    <h2>Willkommen beim Charaktertool</h2>
                    <p>Wähle ein Tool aus der obigen Navigation, um zu beginnen.</p>
                    <ul style="text-align: left; max-width: 400px; margin: 0 auto;">
                        <li><strong>System:</strong> Wähle das gewünschte Regelsystem aus</li>
                        <li><strong>Regelwerk:</strong> Öffnet das Regelwerk des gewählten Systems</li>
                        <li><strong>Charaktergenerator:</strong> Öffnet den Generator des gewählten Systems</li>
                    </ul>
                </div>
            `;
        }

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            const select = document.getElementById('systemSelect');
            if (select) {
                select.addEventListener('change', () => {
                    const active = document.querySelector('.nav-btn.active');
                    if (!active) return;
                    if (active.textContent === 'Regelwerk') {
                        loadMode('rulebook');
                    } else if (active.textContent === 'Charaktergenerator') {
                        loadMode('generator');
                    }
                });
            }
            showHome();
        });
    </script>
</body>
</html>
