<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Charaktergenerator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="toolbar">
      <button id="printBtn">Drucken</button>
      <button id="saveBtn">Speichern</button>
      <input id="fileInput" type="file" accept=".sav,.yaml,.yml">
    </div>
    <div class="stats">
      <div class="stat"><div>AP gesamt:</div><div id="apTotal"></div></div>
      <div class="stat"><div>AP ausgegeben:</div><div><span id="apSpent">0</span></div></div>
      <div class="stat"><div>AP verbleibend:</div><div><span id="apRemaining">0</span></div></div>
    </div>
  </header>

  <main id="characterForm"></main>

  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <script>
    const SYSTEM_CONFIG = {
      dsa: {
        label: 'Simple DSA',
        defs: 'simple_dsa_definitions.js',
        layout: 'simple_dsa_layout.js'
      },
      ars: {
        label: 'Ars Magica',
        defs: 'ars_magica_definitions.js',
        layout: 'ars_magica_layout.js'
      }
    };

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.async = false;
        s.onload = resolve;
        s.onerror = () => reject(new Error(`Konnte ${src} nicht laden`));
        document.body.appendChild(s);
      });
    }

    function currentSystem() {
      const params = new URLSearchParams(window.location.search);
      const raw = params.get('system') || 'dsa';
      return SYSTEM_CONFIG[raw] ? raw : 'dsa';
    }

    async function boot() {
      const systemId = currentSystem();

      const cfg = SYSTEM_CONFIG[systemId];
      document.title = `Charaktergenerator - ${cfg.label}`;

      await loadScript(cfg.defs);
      await loadScript(cfg.layout);
      await loadScript('app.js');
    }

    boot().catch(err => {
      const root = document.getElementById('characterForm');
      root.textContent = `Fehler beim Laden: ${err.message}`;
      console.error(err);
    });
  </script>
</body>
</html>
